# ==============================================================================
# NGINX PRODUCTION CONFIGURATION FOR SATULLAEV.UZ
# Domain: satullaev.uz / www.satullaev.uz
# Location: /etc/nginx/sites-available/satullaev.uz
# Target Document Root: /var/www/html (or /var/www/satullaev.uz/dist)
# ==============================================================================

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name satullaev.uz www.satullaev.uz;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name satullaev.uz www.satullaev.uz;

    # SSL Certificates (e.g. Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/satullaev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satullaev.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/satullaev.uz/chain.pem;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Root Directory
    root /var/www/html;
    index index.html;

    # Gzip Compression for Fast 3D/JS Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        image/svg+xml
        application/wasm;

    # Cache immutable Vite static assets (JS, CSS, WebGL Assets)
    location ~* \.(?:js|css|wasm|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache media & images
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|mp3|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # SPA Routing: Fallback all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional Backend Contact API Proxy (if running Node.js / Express on port 5000)
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
